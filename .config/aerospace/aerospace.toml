    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    # Different Mode Bindings
    alt-shift-semicolon = 'mode service'
    alt-shift-slash = 'mode navigation'
    alt-shift-backspace = 'mode bookmark'
    alt-ctrl-r = 'mode resize'


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    # backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

[mode.navigation.binding]
    esc = ['reload-config', 'mode main']

    # Navigation
    shift-b = ['workspace B', 'exec-and-forget open -a Bruno.app', 'mode main']
    b = ['exec-and-forget open -a Bruno.app', 'mode main']
    shift-d = ['workspace D', 'exec-and-forget open -a TablePlus.app', 'mode main']
    d = ['exec-and-forget open -a TablePlus.app', 'mode main']
    shift-f = ['workspace B', 'exec-and-forget open -a Firefox.app', 'mode main']
    f = ['exec-and-forget open -a Firefox.app', 'mode main']
    shift-g = ['workspace G', 'exec-and-forget open -a Google\ Chrome.app', 'mode main']
    g = ['exec-and-forget open -a Google\ Chrome.app', 'mode main']
    shift-o = ['workspace O', 'exec-and-forget open -a Obsidian.app', 'mode main']
    o = ['exec-and-forget open -a Obsidian.app', 'mode main']
    shift-p = ['workspace P', 'exec-and-forget open -a Phpstorm.app', 'mode main']
    p = ['exec-and-forget open -a Phpstorm.app', 'mode main']
    # shift-t = ['workspace T', 'exec-and-forget open -a Alacritty.app', 'mode main']
    # t = ['exec-and-forget open -a Alacritty.app', 'mode main']
    shift-s = ['workspace S', 'exec-and-forget open -a Slack.app', 'mode main']
    s = ['exec-and-forget open -a Slack.app', 'mode main']
    # shift-v = ['workspace V', 'exec-and-forget open -a Visual\ Studio\ Code.app', 'mode main']
    # v = ['exec-and-forget open -a Visual\ Studio\ Code.app', 'mode main']
    shift-v = ['workspace V', 'exec-and-forget open -a Windsurf.app', 'mode main']
    v = ['exec-and-forget open -a Windsurf.app', 'mode main']

[mode.bookmark.binding]
    a = ["exec-and-forget open https://chatgpt.com", 'mode main']
    g = ["exec-and-forget open -n -a Firefox.app https://google.com", 'mode main']
    esc = 'mode main'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    esc = 'mode main'

[[on-window-detected]]
    if.app-id = "com.mitchellh.ghostty"
    run = "move-node-to-workspace T"

[[on-window-detected]]
    if.app-id = "com.tinyspeck.slackmacgap"
    run = "move-node-to-workspace S"

[[on-window-detected]]
    if.app-id = "com.apple.iCal"
    run = "move-node-to-workspace C"

[[on-window-detected]]
    if.app-id = "com.apple.mail"
    run = "move-node-to-workspace M"

[[on-window-detected]]
    if.app-id = "md.obsidian"
    run = "move-node-to-workspace 1"

[[on-window-detected]]
    if.app-id = "com.tinyapp.TablePlus"
    run = "move-node-to-workspace D"

[[on-window-detected]]
    if.app-id = "com.usebruno.app"
    run = "move-node-to-workspace M"

[[on-window-detected]]
    if.app-id = "com.google.Chrome"
    run = "move-node-to-workspace G"

[[on-window-detected]]
    if.app-id = "org.mozilla.firefox"
    run = "move-node-to-workspace I"

[[on-window-detected]]
    if.app-id = "com.spotify.client"
    run = "move-node-to-workspace M"

[[on-window-detected]]
    if.app-id = "com.bitwarden.desktop"
    run = "move-node-to-workspace B"


